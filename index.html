<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="icones/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icones/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<meta name="theme-color" content="#2747D6">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Deploy-Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a release log for books — shelf of spines up top, then a filterable list of entries, each with its license and formats like a build tag. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#13202C; --muted:#56636F; --line:#D2D9E0;
  --accent:#2747D6; --accent-ink:#FFFFFF; --ok:#1E7A4C; --shelf:#C9D1D9;
  --s1:#2747D6; --s2:#D9572B; --s3:#1E7A4C; --s4:#B88A12; --s5:#7A3FC2; --s6:#0F7E8C; --s7:#B8336A; --s8:#3E4C59;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#161F28; --ink:#E4EAF0; --muted:#94A2AF; --line:#25313D;
  --accent:#8BA2FF; --accent-ink:#0E141A; --ok:#5CC48F; --shelf:#25313D;
  --s1:#5C78F0; --s2:#E87A52; --s3:#3FA674; --s4:#D2A93A; --s5:#9D6BE0; --s6:#2FA3B1; --s7:#D45B8C; --s8:#6A7B8A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#161F28; --ink:#E4EAF0; --muted:#94A2AF; --line:#25313D;
  --accent:#8BA2FF; --accent-ink:#0E141A; --ok:#5CC48F; --shelf:#25313D;
  --s1:#5C78F0; --s2:#E87A52; --s3:#3FA674; --s4:#D2A93A; --s5:#9D6BE0; --s6:#2FA3B1; --s7:#D45B8C; --s8:#6A7B8A;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{max-width:1040px;margin:0 auto;padding-inline:20px;padding-block:28px 64px;display:grid;gap:36px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}

header.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--f-mono);font-weight:600;font-size:15px;display:flex;gap:8px;align-items:center}
.brand .logo{width:28px;height:28px;flex:none}
.brand b{display:inline-block;width:10px;height:18px;background:var(--accent);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.brand b{animation:none}}
.top nav{display:flex;gap:16px;font-size:14px}
.top nav a{color:var(--muted);text-decoration:none}.top nav a:hover{color:var(--ink)}

.hero{display:grid;gap:14px}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(44px,9vw,96px);line-height:.92;letter-spacing:-.035em;margin:0;text-wrap:balance}
.hero h1 span{color:var(--accent)}
.hero p{margin:0;max-width:60ch;color:var(--muted);font-size:18px}
.log{font-family:var(--f-mono);font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.log .ok{color:var(--ok)}

.shelf-box{overflow-x:auto;padding-bottom:4px}
.shelf{display:flex;align-items:flex-end;gap:5px;min-height:190px;padding:0 6px;border-bottom:10px solid var(--shelf);width:max-content;min-width:100%}
.spine{all:unset;cursor:pointer;width:42px;border-radius:3px 3px 0 0;color:#fff;display:flex;align-items:center;justify-content:center;
  writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.01em;
  padding:10px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:inset -4px 0 0 rgba(0,0,0,.18),inset 3px 0 0 rgba(255,255,255,.14);
  transition:translate .15s ease}
.spine:hover,.spine:focus-visible{translate:0 -8px}
.spine.dim{opacity:.28}
@media (prefers-reduced-motion:reduce){.spine{transition:none}}

.tools{display:grid;gap:14px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 14px}
.search span{font-family:var(--f-mono);color:var(--accent);font-weight:600}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:13px 0;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 13px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.chip i{width:9px;height:9px;border-radius:2px;display:inline-block}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{font-family:var(--f-mono);font-size:12px;opacity:.7}

.list{display:grid;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:112px minmax(0,1fr) auto;gap:22px;padding:22px 0;border-bottom:1px solid var(--line);align-items:start}
.item .cover{cursor:default}
/* capas */
.cover{position:relative;width:100%;max-width:100%;aspect-ratio:2/3;border-radius:2px 6px 6px 2px;overflow:hidden;background:var(--c);color:#fff;
  container-type:inline-size;display:flex;flex-direction:column;justify-content:space-between;padding:11% 11% 12% 15%;
  box-shadow:0 1px 2px rgba(10,20,30,.18),0 6px 14px -6px rgba(10,20,30,.35)}
.cover::before{content:"";position:absolute;inset:0 auto 0 0;width:6%;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.12));z-index:1}
.cover::after{content:"";position:absolute;inset:0;opacity:.16;pointer-events:none}
.cover.p0::after{background:repeating-linear-gradient(135deg,#fff 0 1px,transparent 1px 9px)}
.cover.p1::after{background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:12px 12px}
.cover.p2::after{background:radial-gradient(circle at 80% 85%,transparent 0 38%,#fff 38% 39%,transparent 39% 52%,#fff 52% 53%,transparent 53%)}
.cover.p3::after{background:repeating-linear-gradient(0deg,#fff 0 2px,transparent 2px 14px)}
.cv-top{font-family:var(--f-mono);font-size:max(7px,7.5cqi);letter-spacing:.08em;text-transform:uppercase;opacity:.85;position:relative}
.cv-title{font-family:var(--f-display);font-weight:800;font-size:max(9px,16.5cqi);line-height:1.02;letter-spacing:-.02em;position:relative;
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cv-author{font-size:max(7px,7.5cqi);line-height:1.2;opacity:.9;position:relative;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;background:var(--surface)}
/* sugestões da busca */
.search-wrap{position:relative}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 12px 30px -10px rgba(10,20,30,.35);padding:6px;display:grid;gap:2px;max-height:min(70vh,520px);overflow-y:auto}
.sugg button{all:unset;cursor:pointer;display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;padding:6px;border-radius:7px}
.sugg button:hover,.sugg button:focus-visible,.sugg button.on{background:var(--bg)}
.sugg strong{display:block;font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugg span.m{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugg mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;border-radius:2px}
.sugg .none{padding:10px;color:var(--muted)}
.sugg .all{grid-column:1/-1;font-size:13px;color:var(--accent);padding:8px 6px 4px}
.item h3{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.2;margin:0 0 2px;letter-spacing:-.01em}
.meta{color:var(--muted);font-size:14px}
.desc{margin:8px 0 10px;max-width:62ch}
.tags{display:flex;flex-wrap:wrap;gap:6px;font-family:var(--f-mono);font-size:12px}
.tag{border:1px solid var(--line);border-radius:5px;padding:2px 7px;color:var(--muted)}
.tag.fmt{color:var(--ink);text-transform:uppercase;font-weight:600}
.tag.lic{color:var(--ok);border-color:currentColor}
.acts{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:150px}
.btn{font:inherit;font-size:14px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer;border-radius:8px;padding:9px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent)}
.empty{padding:28px 0;color:var(--muted)}
@media (max-width:640px){.item{grid-template-columns:76px minmax(0,1fr);gap:14px}.acts{grid-column:2;flex-direction:row;flex-wrap:wrap;min-width:0}}

.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:grid;gap:10px;align-content:start;min-width:0}
.panel h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0}
.panel p,.panel ol{margin:0;color:var(--muted)}
.panel ol{padding-left:20px;display:grid;gap:4px}
pre{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;font-family:var(--f-mono);font-size:12.5px;line-height:1.5}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
footer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:18px}

/* reader */
.reader{position:fixed;inset:0;background:var(--bg);display:grid;grid-template-rows:auto 1fr;z-index:10}
.reader-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.reader-bar strong{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-display)}
.reader-bar select{max-width:34vw;font:inherit;font-size:14px;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.reader-main{position:relative;min-height:0;padding-bottom:env(safe-area-inset-bottom,0px)}
#viewer{position:absolute;inset:0 56px;background:#fff}
.nav-btn{position:absolute;top:50%;translate:0 -50%;width:44px;height:64px;font-size:22px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.nav-btn.prev{left:6px}.nav-btn.next{right:6px}
.reader-msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><svg class="logo" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#2747D6"/>
  <rect x="11" y="13" width="12" height="38" rx="2" fill="#FFFFFF"/>
  <rect x="11" y="19" width="12" height="3" fill="#2747D6"/>
  <rect x="11" y="42" width="12" height="3" fill="#2747D6"/>
  <rect x="25" y="20" width="11" height="31" rx="2" fill="#F2B13C"/>
  <rect x="25" y="25" width="11" height="3" fill="#2747D6" opacity=".55"/>
  <g transform="rotate(16 38 51)">
    <rect x="38" y="15" width="11" height="36" rx="2" fill="#FFFFFF"/>
    <rect x="38" y="21" width="11" height="3" fill="#2747D6"/>
  </g>
</svg><span>deploy-book</span><b aria-hidden="true"></b></div>

  </header>

  <section class="hero">
    <h1>Deploy-<span>Book</span></h1>
    <div class="log" id="log"><span class="ok">✔ build ok</span></div>
  </section>

  <div class="shelf-box" aria-label="Estante"><div class="shelf" id="shelf"></div></div>

  <section class="tools" id="acervo" aria-label="Busca e filtros">
    <div class="search-wrap">
      <label class="search" for="q"><span>$ grep</span><input id="q" type="search" placeholder="Buscar por título, autor ou assunto" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="sugg"></label>
      <div class="sugg" id="sugg" role="listbox" hidden></div>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Matérias"></div>
    <div class="chips" id="fmts" role="group" aria-label="Formato"></div>
  </section>

  <section>
    <div class="list" id="list"></div>
  </section>


  <footer>Deploy-Book · acervo mantido pelo grupo</footer>
</div>

<div class="reader" id="reader" hidden>
  <div class="reader-bar">
    <button class="btn ghost" id="closeReader" type="button">Fechar</button>
    <strong id="readerTitle">Leitor</strong>
    <select id="toc" aria-label="Sumário"></select>
  </div>
  <div class="reader-main">
    <button class="nav-btn prev" id="prev" type="button" aria-label="Página anterior">‹</button>
    <div id="viewer"></div>
    <div class="reader-msg" id="readerMsg">Carregando…</div>
    <button class="nav-btn next" id="next" type="button" aria-label="Próxima página">›</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
<script>
(function(){
  const SPINE=["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];
  const state={itens:[],materia:"Todas",formato:"Todos",q:""};
  const $=id=>document.getElementById(id);
  const corDe={};
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const norm=s=>String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  const formatsOf=it=>{const f=new Set((it.formatos||[]).map(x=>x.toLowerCase()));(it.arquivos||[]).forEach(a=>f.add(String(a.formato).toLowerCase()));return [...f];};
  const isLocal=u=>u&&!/^[a-z]+:\/\//i.test(u);

  async function carregar(){
    try{
      let r=await fetch("catalogo-site.json",{cache:"no-store"});
      if(!r.ok) r=await fetch("catalogo.json",{cache:"no-store"});
      if(!r.ok) throw new Error(r.status);
      const data=await r.json();
      iniciar(data);
    }catch(e){
      $("list").innerHTML='<p class="empty">Não foi possível ler <code class="mono">catalogo.json</code>. Confira se o arquivo está na mesma pasta do site e se o JSON é válido.</p>';
    }
  }

  function iniciar(data){
    state.itens=data.itens||[];
    const mats=[...new Set(state.itens.map(i=>i.materia))].sort((a,b)=>a.localeCompare(b,"pt"));
    mats.forEach((m,i)=>corDe[m]=SPINE[i%SPINE.length]);
    const nFiles=state.itens.reduce((n,i)=>n+formatsOf(i).filter(f=>f==="pdf"||f==="epub").length,0);
    $("log").innerHTML=`<span class="ok">✔ build ok</span><span>${state.itens.length} materiais</span><span>${mats.length} matérias</span><span>${nFiles} arquivos PDF/EPUB</span><span>atualizado ${esc((data.atualizado||"").split("-").reverse().join("/"))}</span>`;

    $("shelf").innerHTML=state.itens.map((it,i)=>{
      const h=150+((it.titulo.length*7+i*13)%40);
      return `<button class="spine" data-id="${esc(it.id)}" style="height:${h}px;background:var(${corDe[it.materia]})" title="${esc(it.titulo)}">${esc(it.titulo)}</button>`;
    }).join("");
    $("shelf").addEventListener("click",e=>{
      const b=e.target.closest(".spine"); if(!b) return;
      const el=document.getElementById("item-"+b.dataset.id);
      if(el){state.materia="Todas";state.formato="Todos";state.q="";$("q").value="";render();
        document.getElementById("item-"+b.dataset.id).scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"});}
    });

    const chipsHtml=["Todas",...mats].map(m=>{
      const n=m==="Todas"?state.itens.length:state.itens.filter(i=>i.materia===m).length;
      return `<button class="chip" type="button" data-m="${esc(m)}">${m==="Todas"?"":`<i style="background:var(${corDe[m]})"></i>`}${esc(m)} <small>${n}</small></button>`;
    }).join("");
    $("chips").innerHTML=chipsHtml;
    $("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;state.materia=b.dataset.m;render();});
    $("fmts").innerHTML=["Todos","PDF","EPUB"].map(f=>`<button class="chip" type="button" data-f="${f}">${f==="Todos"?"Todos os formatos":f}</button>`).join("");
    $("fmts").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;state.formato=b.dataset.f;render();});
    $("q").addEventListener("input",e=>{state.q=e.target.value;render();mostrarSugestoes();});
    render();
  }

  function render(){
    const q=norm(state.q).trim();
    const vis=state.itens.filter(it=>{
      if(state.materia!=="Todas"&&it.materia!==state.materia) return false;
      if(state.formato!=="Todos"&&!formatsOf(it).includes(state.formato.toLowerCase())) return false;
      if(q&&!norm([it.titulo,it.autor,it.materia,it.descricao].join(" ")).includes(q)) return false;
      return true;
    });
    document.querySelectorAll("#chips .chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===state.materia));
    document.querySelectorAll("#fmts .chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.f===state.formato));
    const ids=new Set(vis.map(i=>i.id));
    document.querySelectorAll(".spine").forEach(s=>s.classList.toggle("dim",!ids.has(s.dataset.id)));

    if(!vis.length){$("list").innerHTML='<p class="empty">Nenhum material encontrado. Tente outra palavra ou limpe os filtros.</p>';return;}
    $("list").innerHTML=vis.map(it=>{
      const acts=[];
      (it.arquivos||[]).forEach((a,k)=>{
        const f=String(a.formato).toLowerCase();
        if(f==="epub"&&isLocal(a.url)) acts.push(`<button class="btn" type="button" data-read="${esc(it.id)}" data-k="${k}">Ler EPUB aqui</button>`);
        acts.push(`<a class="btn ${acts.length?"ghost":""}" href="${esc(a.url)}" target="_blank" rel="noopener">${f==="pdf"?"Abrir PDF":"Baixar "+esc(f.toUpperCase())}</a>`);
      });
      if(it.fonte) acts.push(`<a class="btn ${acts.length?"ghost":""}" href="${esc(it.fonte)}" target="_blank" rel="noopener">Abrir na fonte ↗</a>`);
      return `<article class="item" id="item-${esc(it.id)}">
        ${capaHTML(it)}
        <div style="min-width:0">
          <h3>${esc(it.titulo)}</h3>
          <div class="meta">${[it.autor,it.materia,it.idioma].filter(Boolean).map(esc).join(" · ")}</div>
          ${it.descricao?`<p class="desc">${esc(it.descricao)}</p>`:""}
          <div class="tags" style="margin-top:10px">${formatsOf(it).map(f=>`<span class="tag fmt">${esc(f)}</span>`).join("")}${it.licenca?`<span class="tag lic">${esc(it.licenca)}</span>`:""}</div>
        </div>
        <div class="acts">${acts.join("")}</div>
      </article>`;
    }).join("");
    buscarCapas(vis);
  }

  /* ---------- capas ---------- */
  const capaCache={}, tentou=new Set();
  const hash=s=>[...String(s)].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7);
  function capaHTML(it){
    const src=capaCache[it.id]||it.capa;
    const fmt=formatsOf(it).filter(f=>f!=="html").join(" · ")||"online";
    return `<div class="cover p${hash(it.id)%4}" data-cover="${esc(it.id)}" style="--c:var(${corDe[it.materia]})" aria-hidden="true">
      <span class="cv-top">${esc(it.materia)}</span>
      <span class="cv-title">${esc(it.titulo)}</span>
      <span class="cv-author">${esc(it.autor)}<br><span class="mono" style="opacity:.75">${esc(fmt.toUpperCase())}</span></span>
      ${src?`<img src="${esc(src)}" alt="" loading="lazy">`:""}
    </div>`;
  }
  // imagem de capa quebrada: volta para a capa gerada
  document.addEventListener("error",e=>{const t=e.target;if(t.tagName==="IMG"&&t.parentElement&&t.parentElement.classList.contains("cover"))t.remove();},true);
  function aplicarCapa(id,url){
    capaCache[id]=url;
    document.querySelectorAll(`.cover[data-cover="${CSS.escape(id)}"]`).forEach(c=>{
      if(c.querySelector("img")) return;
      const img=document.createElement("img");img.src=url;img.alt="";c.appendChild(img);
    });
  }
  // sem "capa" no catálogo: tenta tirar a capa do próprio arquivo (EPUB ou 1ª página do PDF)
  let fila=Promise.resolve();
  function buscarCapas(lista){
    lista.forEach(it=>{
      if(it.capa||tentou.has(it.id)) return;
      const arq=(it.arquivos||[]).find(a=>isLocal(a.url)&&/^(epub|pdf)$/i.test(a.formato));
      if(!arq) return;
      tentou.add(it.id);
      fila=fila.then(()=>extrairCapa(arq).then(u=>{if(u)aplicarCapa(it.id,u);}).catch(()=>{}));
    });
  }
  async function extrairCapa(arq){
    if(/epub/i.test(arq.formato)){
      if(typeof ePub!=="function") return null;
      const b=ePub(arq.url); await b.opened;
      return await b.coverUrl();
    }
    const lib=await carregarPdfJs(); if(!lib) return null;
    const doc=await lib.getDocument(arq.url).promise;
    const pg=await doc.getPage(1);
    const v0=pg.getViewport({scale:1}), scale=360/v0.width, vp=pg.getViewport({scale});
    const cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;
    await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
    const url=cv.toDataURL("image/jpeg",.82); doc.destroy(); return url;
  }
  let pdfJsP=null;
  function carregarPdfJs(){
    if(!pdfJsP) pdfJsP=new Promise(res=>{
      const base="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
      const s=document.createElement("script");s.src=base+"pdf.min.js";
      s.onload=()=>{const l=window.pdfjsLib;if(l)l.GlobalWorkerOptions.workerSrc=base+"pdf.worker.min.js";res(l||null);};
      s.onerror=()=>res(null);document.head.appendChild(s);
    });
    return pdfJsP;
  }

  /* ---------- sugestões da busca ---------- */
  let suggIdx=-1;
  const realce=(txt,q)=>{
    if(!q) return esc(txt);
    const n=norm(txt), i=n.indexOf(q);
    if(i<0) return esc(txt);
    return esc(txt.slice(0,i))+"<mark>"+esc(txt.slice(i,i+q.length))+"</mark>"+esc(txt.slice(i+q.length));
  };
  function mostrarSugestoes(){
    const q=norm(state.q).trim(), box=$("sugg");
    if(!q){fecharSugestoes();return;}
    const res=state.itens.filter(it=>norm([it.titulo,it.autor,it.materia,it.descricao].join(" ")).includes(q));
    suggIdx=-1;
    box.innerHTML=res.length
      ? res.slice(0,6).map(it=>`<button type="button" role="option" data-id="${esc(it.id)}">${capaHTML(it)}<span style="min-width:0"><strong>${realce(it.titulo,q)}</strong><span class="m">${it.autor?realce(it.autor,q)+" · ":""}${esc(it.materia)}</span></span></button>`).join("")
        +(res.length>6?`<span class="all">+ ${res.length-6} na lista abaixo</span>`:"")
      : `<div class="none">Nada encontrado para “${esc(state.q.trim())}”.</div>`;
    box.hidden=false;$("q").setAttribute("aria-expanded","true");
    buscarCapas(res.slice(0,6));
  }
  function fecharSugestoes(){$("sugg").hidden=true;$("q").setAttribute("aria-expanded","false");suggIdx=-1;}
  function irPara(id){
    fecharSugestoes();
    const el=document.getElementById("item-"+id); if(!el) return;
    el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"});
  }
  $("sugg").addEventListener("mousedown",e=>e.preventDefault());
  $("sugg").addEventListener("click",e=>{const b=e.target.closest("button[data-id]");if(b)irPara(b.dataset.id);});
  $("q").addEventListener("focus",mostrarSugestoes);
  $("q").addEventListener("blur",()=>setTimeout(fecharSugestoes,120));
  $("q").addEventListener("keydown",e=>{
    const bs=[...$("sugg").querySelectorAll("button[data-id]")];
    if(e.key==="Escape"){fecharSugestoes();return;}
    if(!bs.length) return;
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){
      e.preventDefault();
      suggIdx=(suggIdx+(e.key==="ArrowDown"?1:-1)+bs.length)%bs.length;
      bs.forEach((b,i)=>b.classList.toggle("on",i===suggIdx));
    }else if(e.key==="Enter"){e.preventDefault();irPara(bs[Math.max(suggIdx,0)].dataset.id);}
  });

  $("list").addEventListener("click",e=>{
    const b=e.target.closest("[data-read]"); if(!b) return;
    const it=state.itens.find(i=>i.id===b.dataset.read);
    abrirEpub(it.arquivos[+b.dataset.k].url,it.titulo);
  });

  /* ---------- leitor EPUB ---------- */
  let book=null,rendition=null;
  function fecharLeitor(){
    if(book){try{book.destroy();}catch(_){}}
    book=null;rendition=null;$("viewer").innerHTML="";$("reader").hidden=true;document.body.style.overflow="";
  }
  async function abrirEpub(src,titulo){
    if(typeof ePub!=="function"){alertMsg("O leitor não carregou. Verifique sua conexão e recarregue a página.");return;}
    fecharLeitor();
    $("reader").hidden=false;document.body.style.overflow="hidden";
    $("readerTitle").textContent=titulo||"Leitor";$("readerMsg").hidden=false;$("readerMsg").textContent="Carregando…";
    try{
      book=ePub(src);
      rendition=book.renderTo("viewer",{width:"100%",height:"100%",spread:"none"});
      await rendition.display();
      $("readerMsg").hidden=true;
      const nav=await book.loaded.navigation;
      const flat=[];(function walk(l,d){l.forEach(x=>{flat.push({href:x.href,label:" ".repeat(d*2)+x.label.trim()});if(x.subitems)walk(x.subitems,d+1);});})(nav.toc||[],0);
      $("toc").innerHTML='<option value="">Sumário</option>'+flat.map(t=>`<option value="${esc(t.href)}">${esc(t.label)}</option>`).join("");
      if(!titulo){const md=await book.loaded.metadata;$("readerTitle").textContent=md.title||"Leitor";}
    }catch(err){$("readerMsg").hidden=false;$("readerMsg").textContent="Não foi possível abrir este EPUB. O arquivo pode estar corrompido ou protegido por DRM.";}
  }
  function alertMsg(t){$("reader").hidden=false;$("readerMsg").hidden=false;$("readerMsg").textContent=t;}
  $("toc").addEventListener("change",e=>{if(rendition&&e.target.value)rendition.display(e.target.value);});
  $("prev").addEventListener("click",()=>rendition&&rendition.prev());
  $("next").addEventListener("click",()=>rendition&&rendition.next());
  $("closeReader").addEventListener("click",fecharLeitor);
  document.addEventListener("keydown",e=>{
    if($("reader").hidden) return;
    if(e.key==="ArrowLeft")rendition&&rendition.prev();
    else if(e.key==="ArrowRight")rendition&&rendition.next();
    else if(e.key==="Escape")fecharLeitor();
  });

  carregar();
})();
</script>
